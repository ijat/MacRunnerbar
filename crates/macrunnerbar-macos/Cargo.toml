[package]
name = "macrunnerbar-macos"
description = "macOS adapters for MacRunnerbar: runner processes, Keychain, LaunchAgent, logging, notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
macrunnerbar-core = { path = "../macrunnerbar-core" }
flate2 = "1"
libc = "0.2"
serde_json = "1"
tar = { version = "0.4", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
macrunnerbar-testkit = { path = "../macrunnerbar-testkit" }

# The only crate allowed to use `unsafe` (CLAUDE.md, D12): it does not inherit the workspace table,
# which forbids it. Every `unsafe` block needs a `// SAFETY:` comment (enforced below).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
