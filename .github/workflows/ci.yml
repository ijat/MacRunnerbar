name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # The project's own self-hosted Apple silicon runner (the app's crates are macOS-only; the app dogfoods itself).
    # The repo is public, so a fork PR could run arbitrary code on that Mac: the guard below skips fork PRs.
    # Push, workflow_dispatch and same-repo PRs run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - name: Put rustup/cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install gitleaks
        run: command -v gitleaks || brew install gitleaks
      - name: Gate (fmt, clippy, tests, boundaries, secrets)
        run: scripts/gate.sh
      - name: Bundle the app (ad-hoc signed)
        run: scripts/bundle.sh
