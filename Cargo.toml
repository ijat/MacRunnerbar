[workspace]
resolver = "3"
members = ["crates/*"] # step 5 adds "apps/*"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"

# Lints follow luneui-rs, plus `unsafe_code = forbid`. Only `macrunnerbar-macos` may use `unsafe`
# (CLAUDE.md); it defines its own `[lints]` table instead of inheriting this one.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
